<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Generator</title>
    <link rel="stylesheet" href="Milestone.css">
</head>
<body>
    <h1 id="page-title">Welcome To Your Next Life Milestone</h1>
    <div id="content">
        <form id="milestoneForm">
            <label for="name">Enter your name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="age">Enter your age:</label><br>
            <input type="number" id="age" name="age" required><br><br>

            <label for="gender">Select your gender:</label><br>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
            </select><br><br>

            <label for="race">Select your race:</label><br>
            <select id="race" name="race" required>
                <option value="asian">Asian</option>
                <option value="black">Black or African American</option>
                <option value="hispanic">Hispanic or Latino</option>
                <option value="white">White</option>
                <option value="native">Native American or Alaska Native</option>
                <option value="pacific-islander">Native Hawaiian or Other Pacific Islander</option>
                <option value="other">Other</option>
            </select><br><br>

            <label for="beliefs">Select your beliefs:</label><br>
            <select id="beliefs" name="beliefs" required>
                <option value="christianity">Christianity</option>
                <option value="islam">Islam</option>
                <option value="hinduism">Hinduism</option>
                <option value="buddhism">Buddhism</option>
                <option value="judaism">Judaism</option>
                <option value="atheism">Atheism</option>
                <option value="agnosticism">Agnosticism</option>
                <option value="spiritual">Spiritual but not religious</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
            </select><br><br>

            <label for="name">Enter your hometown:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="name">Enter your current location:</label><br>
            <input type="text" id="name" name="name" required><br><br>



            <button type="button" onclick="generateMilestone()">Submit</button>
        </form>
    </div>

    <h2 id="result"></h2>

    <script src="Milestone.js"></script>
</body>
</html>
